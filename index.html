<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Este é um jogo de Amigo Secreto desenvolvido para o Desafio do Oracle Next Education (Grupo 9 - 2025)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-content">
        <div class="header-banner">
            <h1 class="main-title">Este é um jogo de Amigo Secreto desenvolvido para o Desafio do Oracle Next Education (Grupo 9 - 2025)</h1>
        </div>

        <div class="input-section">
            <div class="column-container">
                <div id="price-column" class="column">
                    <h2 class="section-title">Valor Definido</h2>
                    <h3 id="valor-gasto">R$ 0,00</h3>
                </div>
                
                <div id="game-input-container" class="column">
                    <h2 id="input-title" class="section-title">Qual será o valor a ser gasto por pessoa?</h2>
                    <div class="input-wrapper">
                        <input type="text" id="amigo" placeholder="Digite o valor (R$)" class="input-name">
                        <button id="add-btn">Definir</button>
                    </div>
                    <div class="button-container">
                        <button id="sortearBtn">Sortear</button>
                    </div>
                </div>

                <div id="names-column" class="column">
                    <h2 class="section-title">Amigos Adicionados</h2>
                    <ul id="amigos-lista">
                        </ul>
                </div>
            </div>

            <div id="resultado-sorteio" class="result-section">
                </div>
            
        </div>
    </div>
    
    <script src="app.js"></script>

</body>
</html>
